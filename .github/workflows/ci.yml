name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups
      - run: uv run ruff format --check . && uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      # Only the formula reference is compared byte for byte. The checks reference holds
      # eigenvalues near double-precision noise, whose last digits differ between CPUs;
      # test_checks.py already fails if any verdict changes.
      - name: Formula reference is up to date
        run: |
          uv run python scripts/make_reference.py --formulas
          git diff --exit-code docs/reference/formulas.md

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  package:
    # The wheel must carry the explorer, and `qubitlab serve` must answer from a clean install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Build the explorer into the package
        working-directory: web
        run: npm ci --legacy-peer-deps && npm run build:package
      - run: uv build
      - run: ./scripts/smoke_wheel.sh
