[project]
name = "qubitlab"
version = "0.1.0"
description = "Cat qubit and transmon physics, from closed-form theory to Dynamiqs simulation, with a 3D explorer"
readme = "README.md"
authors = [
    { name = "Pranav Reddy" }
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dynamiqs>=0.3.7",
    "fastapi>=0.160.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "scqubits>=4.1.0",
    "sympy>=1.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
qubitlab = "qubitlab.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.5",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/qubitlab"]

[[tool.mypy.overrides]]
module = ["dynamiqs.*", "sympy.*", "jax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
markers = ["slow: Liouvillian spectra and long solves"]

[[tool.mypy.overrides]]
# scqubits ships no type stubs and does not declare its public names.
module = ["scqubits", "scqubits.*"]
follow_imports = "skip"
ignore_missing_imports = true
