[project]
name = "qubitlab"
version = "1.0.0"
description = "An open-source simulator for learning superconducting qubits: cited theory, checked against Dynamiqs, scqubits and Stim, in a 3D explorer"
readme = "README.md"
authors = [
    { name = "Pranav Reddy" }
]
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["superconducting qubits", "cat qubit", "transmon", "quantum error correction", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "dynamiqs>=0.3.7",
    "fastapi>=0.160.0",
    "numpy>=2.5.4",
    "optax>=0.2.8",
    "pydantic>=2.14.1",
    "pymatching>=2.4.0",
    "scqubits>=4.1.0",
    "slowapi>=0.1.10",
    "stim>=1.16.0",
    "sympy>=1.14.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/pkarakala/qubit-lab"
Changelog = "https://github.com/pkarakala/qubit-lab/blob/main/CHANGELOG.md"
Course = "https://github.com/pkarakala/qubit-lab/tree/main/docs/learn"

[project.scripts]
qubitlab = "qubitlab.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.5",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/qubitlab"]

[[tool.mypy.overrides]]
module = ["dynamiqs.*", "sympy.*", "jax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
markers = ["slow: Liouvillian spectra and long solves"]

[[tool.mypy.overrides]]
# No type stubs: scqubits does not declare its public names; Stim and PyMatching are compiled extensions; optax ships no stubs.
module = ["scqubits", "scqubits.*", "stim", "pymatching", "optax"]
follow_imports = "skip"
ignore_missing_imports = true
